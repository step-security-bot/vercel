name: vercel PROD

permissions:
  id-token: write # This is required for requesting the JWT.
  contents: read
  checks: write
  packages: read
  statuses: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  terraform:
    name: Terraform plan & apply
    runs-on: ubuntu-latest
    environment: PROD
    env:
      REGION: us-east-1
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - uses: hashicorp/setup-terraform@ed3a0531877aca392eb870f440d9ae7aba83a6bd # v1.4.0
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

      - name: Config Terraform plugin cache
        run: |
          echo 'plugin_cache_dir="$HOME/.terraform.d/plugin-cache"' >~/.terraformrc
          mkdir --parents ~/.terraform.d/plugin-cache

      - name: Cache Terraform
        uses: actions/cache@8492260343ad570701412c2f464a5877dc76bace # v2
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('.terraform.lock.hcl') }}

      - name: Verify Terraform version
        run: terraform --version

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2.2.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Configure aws credential profile
        run: |
              aws configure set default.region us-east-1
              aws configure set default.aws_access_key_id ${{ env.AWS_ACCESS_KEY_ID }}
              aws configure set default.aws_secret_access_key ${{ env.AWS_SECRET_ACCESS_KEY }}
              aws configure set aws_session_token ${{ env.AWS_SESSION_TOKEN }}

      - run: aws configure list-profiles

      - name: Terraform init
        id: init
        run: terraform init
        
      - name: Terraform validation
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan

      - name: Terraform apply
        if: success() && github.ref == 'refs/heads/main'
        run: terraform apply --auto-approve



